<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Patrimoine · Thomas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080f;--bg2:#0f0f1a;--bg3:#161622;--bg4:#1e1e2e;--border:rgba(255,255,255,0.06);--text:#eeeef8;--text2:#9898b8;--text3:#565670;--cyan:#5ee7df;--blue:#4d9fff;--blue2:#2563eb;--purple:#a78bfa;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--orange:#fb923c;--font-d:'Syne',sans-serif;--font-m:'Manrope',sans-serif;--font-mono:'DM Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-m);}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite alternate;opacity:var(--o);}
@keyframes twinkle{from{opacity:var(--o);}to{opacity:calc(var(--o)*0.2);}}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;}
#content{flex:1;overflow-y:auto;padding:20px 16px 8px;-webkit-overflow-scrolling:touch;}
#content::-webkit-scrollbar{display:none;}
#nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));gap:4px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border:none;background:none;color:var(--text3);cursor:pointer;border-radius:12px;transition:all 0.2s;}
.nav-btn.active{color:var(--cyan);background:rgba(94,231,223,0.07);}
.nav-icon{font-size:19px;}
.nav-label{font-size:9px;font-weight:700;letter-spacing:0.05em;font-family:var(--font-m);}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:12px;animation:up 0.3s cubic-bezier(.4,0,.2,1) both;}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(6){animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.card-title{font-size:9px;letter-spacing:0.18em;color:var(--text3);font-weight:700;font-family:var(--font-mono);margin-bottom:14px;text-transform:uppercase;}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.row-left{display:flex;align-items:center;gap:10px;}
.row-name{font-size:13px;font-weight:600;color:var(--text2);}
.row-val{font-size:15px;font-weight:900;font-family:var(--font-d);color:var(--text);cursor:pointer;border-bottom:1px dashed var(--text3);transition:color .15s;}
.row-val:active{color:var(--cyan);}
.bar-wrap{margin-bottom:12px;}.bar-wrap:last-child{margin-bottom:0;}
.bar-header{display:flex;justify-content:space-between;margin-bottom:5px;}
.bar-name{font-size:11px;font-weight:700;color:var(--text2);}
.bar-val{font-size:11px;color:var(--text3);font-family:var(--font-mono);}
.bar-track{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.4,0,.2,1);}
.jalon{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border);}
.jalon:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none;}
.jalon-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.jalon-name{font-size:13px;font-weight:900;font-family:var(--font-d);}
.jalon-rente{font-size:20px;font-weight:900;font-family:var(--font-d);}
.jalon-track{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:4px;}
.jalon-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.jalon-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);font-family:var(--font-mono);}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(10px);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
#overlay.show{opacity:1;pointer-events:all;}
.sheet{background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--border);border-bottom:none;padding:28px 20px 36px;width:100%;}
.sheet-title{font-size:20px;font-weight:900;font-family:var(--font-d);margin-bottom:4px;}
.sheet-hint{font-size:12px;color:var(--text3);margin-bottom:22px;font-family:var(--font-mono);}
#field{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:14px;padding:16px;font-size:28px;font-family:var(--font-d);font-weight:900;color:var(--cyan);outline:none;-webkit-appearance:none;transition:border-color .2s;}
#field:focus{border-color:var(--cyan);}
.btns{display:flex;gap:10px;margin-top:14px;}
.btn{flex:1;padding:15px;border-radius:14px;border:none;font-size:15px;font-weight:900;font-family:var(--font-d);cursor:pointer;}
.btn-cancel{background:var(--bg4);color:var(--text3);}
.btn-ok{background:var(--cyan);color:var(--bg);}
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
#modalOverlay.show{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--border);border-bottom:none;padding:24px 20px 36px;width:100%;max-height:90dvh;overflow-y:auto;}
.modal-sheet::-webkit-scrollbar{display:none;}
.modal-title{font-size:22px;font-weight:900;font-family:var(--font-d);margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:20px;}
.modal-field-wrap{margin-bottom:10px;}
.modal-field-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;display:flex;justify-content:space-between;}
.modal-field-label span{color:var(--text3);font-family:var(--font-mono);font-weight:400;}
.modal-field{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:16px;font-family:var(--font-d);font-weight:700;color:var(--cyan);outline:none;-webkit-appearance:none;}
.modal-field:focus{border-color:var(--cyan);}
select.modal-field{color:var(--cyan);}
.platform-group{background:var(--bg3);border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--border);}
.platform-label{font-size:10px;letter-spacing:.12em;color:var(--cyan);font-weight:700;font-family:var(--font-mono);margin-bottom:12px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.platform-label::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);}
.platform-field-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.platform-field-row:last-child{margin-bottom:0;}
.platform-field-name{font-size:12px;font-weight:600;color:var(--text2);flex:1;min-width:0;}
.platform-field-input{width:110px;flex-shrink:0;background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:15px;font-family:var(--font-d);font-weight:700;color:var(--cyan);outline:none;-webkit-appearance:none;text-align:right;}
.platform-field-input:focus{border-color:var(--cyan);}
.dep-bank-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.dep-bank-row:last-child{border-bottom:none;}
.dep-bank-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.dep-bank-name{flex:1;font-size:13px;font-weight:700;color:var(--text2);}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">
  <div id="content"></div>
  <nav id="nav">
    <button class="nav-btn active" onclick="setView('dashboard')" id="nav-dashboard"><span class="nav-icon">💼</span><span class="nav-label">Patrimoine</span></button>
    <button class="nav-btn" onclick="setView('budget')" id="nav-budget"><span class="nav-icon">💸</span><span class="nav-label">Budget</span></button>

</div>
<div id="overlay" onclick="handleBg(event)">
  <div class="sheet">
    <div class="sheet-title" id="fieldName">Montant</div>

    <input type="number" inputmode="decimal" id="field" placeholder="0">
    <div class="btns">
      <button class="btn btn-cancel" onclick="closeInput()">Annuler</button>
      <button class="btn btn-ok" onclick="confirmInput()">Valider ✓</button>
    </div>

</div>
<div id="modalOverlay" onclick="handleModalBg(event)">

<script>

// Banques pour les dépenses globales

const DEFAULTS = {

    wpea:{label:'WPEA · iShares World',value:5799,isWorld:true,color:'#4299e1'},
    france:{label:'France · iShares',value:1609,isWorld:false,color:'#a78bfa'},
    sp500:{label:'S&P500 · BNP',value:1884,isWorld:false,color:'#f6ad55'},

    {date:'Mai 25',total:40964},{date:'Jul 25',total:42426},{date:'Aoû 25',total:44585},{date:'Oct 25',total:46655},

      depenses: { tr:0, bourso:2805.16, cic:0, n26:0, swile:0, especes:0 },
      invests: [

        { montant:50,  type:'BTC récurrent',  note:'' },
      ],
      ciel: [
        { montant:15,   type:'Saveback BTC',     note:'' },
        { montant:4.70, type:'Roundup Berkshire', note:'' },

      ],

        { montant:14.21, type:'Autre',              note:'REMB MSA' },
        { montant:25.30, type:'Autre',              note:'REMB GRPM' },

      ],
      depenses: { tr:0, bourso:2976.50, cic:0, n26:0, swile:0, especes:0 },

      ],
      remboursements: [

        { montant:150, type:'Remboursement amis', note:'RMB Arthur' },
      ],
    },
  },
};

// ─── SUPABASE ────────────────────────────────────────────────────────────────
const SUPA_URL = 'https://hdpexpeoktfijcegxpua.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkcGV4cGVva3RmaWpjZWd4cHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMzczMjUsImV4cCI6MjA4ODkxMzMyNX0.hQnglDt1nhg0D0Dz_zpJ6KS81OrDraay8fzbdtC9kWE';
async function supaFetch(path, opts={}) {
  const {headers:extraHeaders={}, ...restOpts} = opts;
  const res = await fetch(SUPA_URL+'/rest/v1/'+path, { headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal',...extraHeaders}, ...restOpts });
  if (!res.ok) { const t=await res.text(); throw new Error(t); }
  try { return await res.json(); } catch { return null; }
}
async function loadFromCloud() {
  try { const rows=await supaFetch('snapshots?order=date.desc&limit=1'); if (rows&&rows.length) return rows[0].data; } catch(e) { console.warn('Cloud load failed',e); }
  return null;
}
async function saveToCloud(s) {
  const date=new Date().toISOString().slice(0,10);
  try { await supaFetch('snapshots',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({date,data:s})}); } catch(e) { console.warn('Cloud save failed',e); }
  localStorage.setItem('pat3',JSON.stringify(s));
}

let state = JSON.parse(JSON.stringify(DEFAULTS));
let view = 'dashboard';
let inputKey = null;
let budgetMonth = getCurrentMonthKey();

function loadState() {
  try { const s=localStorage.getItem('pat3'); return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULTS)); } catch { return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save() { localStorage.setItem('pat3',JSON.stringify(state)); saveToCloud(state).catch(()=>{}); }

// Migration : convertit un ancien mois (depenses = array) vers le nouveau format (depenses = objet banques)
function migrateMonth(mo) {
  if (!mo) return mo;
  if (Array.isArray(mo.depenses)) {
    const total = mo.depenses.reduce((s,d)=>s+(d.montant||0),0);
    mo.depenses = { tr:0, bourso:Math.round(total*100)/100, cic:0, n26:0, especes:0 };
  }
  if (!mo.depenses || typeof mo.depenses!=='object') mo.depenses={tr:0,bourso:0,cic:0,n26:0,especes:0};
  DEP_BANKS.forEach(b=>{ if(typeof mo.depenses[b.key]!=='number') mo.depenses[b.key]=0; });
  // Migration remboursements : ancien format avait "cat", nouveau a "type"
  if (Array.isArray(mo.remboursements)) {
    mo.remboursements.forEach(r=>{ if(!r.type){ r.type = r.note&&r.note.includes('Loïc')?'Participation Loïc':'Autre'; } });
  } else { mo.remboursements=[]; }
  if (!Array.isArray(mo.revenus)) mo.revenus=[];
  if (!Array.isArray(mo.invests)) mo.invests=[];
  if (!Array.isArray(mo.ciel)) mo.ciel=[];
  return mo;
}

async function initState() {
  const FIXED_MONTHS = Object.keys(DEFAULTS.budget||{});
  state = loadState();
  if (!state.budget) state.budget = {};
  if (!state.objectifsGrind) state.objectifsGrind = {};
  Object.entries(DEFAULTS.objectifsGrind).forEach(([y,v]) => { if (!state.objectifsGrind[y]) state.objectifsGrind[y]=v; });
  FIXED_MONTHS.forEach(month => { state.budget[month]=JSON.parse(JSON.stringify(DEFAULTS.budget[month])); });
  // Migrer tous les mois
  Object.keys(state.budget).forEach(k=>{ state.budget[k]=migrateMonth(state.budget[k]); });
  render();
  showSyncStatus('⏳ Sync cloud…');
  try {
    const cloud = await loadFromCloud();
    if (cloud) {
      if (cloud.history && cloud.history.length>=(state.history||[]).length) {
        const cloudBudget=cloud.budget||{};
        const mergedBudget={...cloudBudget};
        FIXED_MONTHS.forEach(month => { mergedBudget[month]=JSON.parse(JSON.stringify(DEFAULTS.budget[month])); });
        state={...state,...cloud};
        state.budget=mergedBudget;
        Object.keys(state.budget).forEach(k=>{ state.budget[k]=migrateMonth(state.budget[k]); });
        if (!state.objectifsGrind) state.objectifsGrind={};
        Object.entries(DEFAULTS.objectifsGrind).forEach(([y,v]) => { if (!state.objectifsGrind[y]) state.objectifsGrind[y]=v; });
      }
      showSyncStatus('☁️ Sync OK',2000); render();
    } else { showSyncStatus('📱 Local only',1500); }
  } catch { showSyncStatus('⚠️ Offline',2000); }
  save();
}

function showSyncStatus(msg,hideAfter=0) {
  let el=document.getElementById('syncBadge');
  if (!el) { el=document.createElement('div'); el.id='syncBadge'; el.style.cssText='position:fixed;top:12px;right:14px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:10px;font-family:var(--font-mono);color:var(--text3);z-index:500;transition:opacity .4s'; document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  if (hideAfter) setTimeout(()=>{ el.style.opacity='0'; },hideAfter);
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
const fmt = v => { if (v===null||v===undefined) return '—'; const abs=Math.abs(v); const n=abs%1===0?abs.toLocaleString('fr-FR'):abs.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}); return (v<0?'-':'')+n+'€'; };
const pct = (a,b) => b>0?Math.min((a/b)*100,100):0;
function getCurrentMonthKey() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function getMonthLabel(key) { const [y,m]=key.split('-'); return ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'][parseInt(m)-1]+' '+y.slice(2); }
function getBudgetMonth(key) {
  if (!state.budget) state.budget={};
  if (!state.budget[key]) state.budget[key]={depenses:{tr:0,bourso:0,cic:0,n26:0,especes:0},revenus:[],invests:[],ciel:[],remboursements:[]};
  state.budget[key]=migrateMonth(state.budget[key]);
  return state.budget[key];
}
function budgetStats(key) {
  const m=getBudgetMonth(key);
  const totalRevenu  = m.revenus.reduce((s,r)=>s+r.montant,0);
  const totalDepense = DEP_BANKS.reduce((s,b)=>s+(m.depenses[b.key]||0),0);
  const totalRemb    = (m.remboursements||[]).reduce((s,r)=>s+r.montant,0);
  const totalDepNette= totalDepense - totalRemb;
  const investPoche  = m.invests.reduce((s,i)=>s+i.montant,0);
  const totalCiel    = m.ciel.reduce((s,c)=>s+c.montant,0);
  const totalInvest  = investPoche+totalCiel;
  const savings      = totalRevenu-totalDepNette-investPoche;
  const grind        = savings+totalInvest;
  return {totalRevenu,totalDepense,totalRemb,totalDepNette,investPoche,totalCiel,totalInvest,savings,grind};
}

// ─── OBJECTIF GRIND ──────────────────────────────────────────────────────────
function getObjectifGrind(annee) { if (!state.objectifsGrind) state.objectifsGrind={}; return state.objectifsGrind[annee] || 10000; }
function openObjectifModal(annee) {
  const current=getObjectifGrind(annee);
  document.getElementById('modalSheet').innerHTML='<div class="modal-title">🎯 Objectif GRIND '+annee+'</div><div class="modal-sub">Montant total à accumuler sur l\'année</div><div class="modal-field-wrap"><div class="modal-field-label">Objectif annuel (€)<span>actuel : '+fmt(current)+'</span></div><input class="modal-field" type="number" inputmode="decimal" id="obj_val" value="'+current+'" placeholder="'+current+'"></div><div class="btns"><button class="btn btn-cancel" onclick="closeModal()">Annuler</button><button class="btn btn-ok" onclick="confirmObjectif(\''+annee+'\')">Valider ✓</button></div>';
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('obj_val')?.select(),120);
}
function confirmObjectif(annee) {
  const val=parseFloat((document.getElementById('obj_val')?.value||'0').replace(',','.'));
  if (isNaN(val)||val<=0) { closeModal(); return; }
  if (!state.objectifsGrind) state.objectifsGrind={};
  state.objectifsGrind[annee]=val; save(); closeModal(); render();
}

// ─── PATRIMOINE ───────────────────────────────────────────────────────────────
function getPEA()     { return Object.values(state.pea).reduce((s,e)=>s+e.value,0); }
function getBanques() { return Object.values(state.banques).reduce((s,a)=>s+a.value,0); }
function getCrypto()  { return Object.values(state.crypto).reduce((s,a)=>s+a.value,0); }
function getActions() { return Object.values(state.actions).reduce((s,a)=>s+a.value,0)+getPEA(); }
function getTotal()   { return getBanques()+getActions()+getCrypto(); }
function getWorld()   { return Object.values(state.pea).filter(e=>e.isWorld).reduce((s,e)=>s+e.value,0)+state.actions.epSal.value; }
function getEM()      { return state.pea.em.value; }
function rente(cap)   { return cap*0.04*(1-0.6*0.172)/12; }
function todayLabel() { return new Date().toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}); }
function pushHistory() {
  const d=todayLabel(), t=getTotal();
  state.history=state.history.filter(h=>h.date!==d);
  state.history.push({date:d,total:t});
  if (state.history.length>36) state.history=state.history.slice(-36);
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function setView(v) { view=v; document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById('nav-'+v).classList.add('active'); render(); }
function render() {
  const el=document.getElementById('content'); el.innerHTML='';
  if (view==='dashboard') renderDashboard(el);
  else if (view==='budget') renderBudget(el);
  else if (view==='stats')  renderStats(el);
  else if (view==='fire')   renderFire(el);
  else renderHistorique(el);
}

function confirmBudget() {
  const montant=parseFloat((document.getElementById('bm_montant')?.value||'0').replace(',','.')); if(!montant||montant<=0){closeModal();return;}
  const note=document.getElementById('bm_note')?.value||'', type=document.getElementById('bm_type').value, m=getBudgetMonth(budgetMonth);

}

// ─── FIRE ─────────────────────────────────────────────────────────────────────
function renderFire(el) {
  const total=getTotal(), renteM=rente(total);
  const hd=document.createElement('div'); hd.style.cssText='margin-bottom:20px';
  hd.innerHTML='<div style="font-size:24px;font-weight:900;font-family:var(--font-d)">FIRE</div><div style="font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-top:2px">liberté financière · règle des 4%</div>';
  el.appendChild(hd);
  const renteCard=document.createElement('div'); renteCard.className='card';
  renteCard.innerHTML=`<div class="card-title">TA RENTE AUJOURD'HUI</div><div style="text-align:center;padding:10px 0 18px"><div style="font-size:11px;color:var(--text3);font-family:var(--font-mono);letter-spacing:.1em;margin-bottom:8px">SI TU RETIRAIS 4% PAR AN</div><div style="font-size:56px;font-weight:900;font-family:var(--font-d);color:var(--cyan);line-height:1">${Math.round(renteM).toLocaleString('fr-FR')}€</div><div style="font-size:12px;color:var(--text3);margin-top:6px">/ mois net · sur ${fmt(total)}</div></div><div style="background:var(--bg3);border-radius:12px;padding:12px 14px;font-family:var(--font-mono);font-size:11px;color:var(--text3);line-height:2.2"><div style="display:flex;justify-content:space-between"><span>Retrait brut 4%/an</span><span style="color:var(--text);font-weight:700">${Math.round(total*0.04).toLocaleString('fr-FR')}€</span></div><div style="display:flex;justify-content:space-between"><span>PS sur PV (17,2% × 60%)</span><span style="color:var(--red)">−${Math.round(total*0.04*0.6*0.172).toLocaleString('fr-FR')}€</span></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:6px;margin-top:2px"><span style="color:var(--text);font-weight:700">Net mensuel</span><span style="color:var(--cyan);font-weight:800">${Math.round(renteM).toLocaleString('fr-FR')}€</span></div></div>`;
  el.appendChild(renteCard);

  // Projection basée sur le GRIND réel
  const budgetKeys=Object.keys(state.budget||{}).sort();
  const grindVals=budgetKeys.map(k=>budgetStats(k)).filter(s=>s.totalRevenu>0).map(s=>s.grind);
  if (grindVals.length>=1) {
    const grindMoyen=grindVals.reduce((s,v)=>s+v,0)/grindVals.length;
    const tauxMensuel=Math.pow(1.07,1/12)-1;
    function moisPourCible(cible,capital,vers){ if(capital>=cible)return 0; let c=capital,mois=0; while(c<cible&&mois<1200){c=c*(1+tauxMensuel)+vers;mois++;} return mois>=1200?null:mois; }
    const fmtDuree=mois=>{ if(mois===null)return '∞'; const ans=Math.floor(mois/12),mm=mois%12; return ans>0?ans+' an'+(ans>1?'s':'')+(mm>0?' '+mm+' mois':''):mm+' mois'; };
    const projCard=document.createElement('div'); projCard.className='card';
    projCard.innerHTML=`<div class="card-title">PROJECTION · TON GRIND RÉEL</div><div style="font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-bottom:14px">GRIND moyen ${grindVals.length} mois : <span style="color:var(--cyan);font-weight:700">${Math.round(grindMoyen).toLocaleString('fr-FR')}€/mois</span> · rendement 7%/an</div><div style="display:flex;flex-direction:column;gap:10px">${[{label:'100 000€',val:100000,color:'#a78bfa'},{label:'250 000€',val:250000,color:'#f6e05e'},{label:'FIRE 1,6M€',val:1600000,color:'#76e4f7'}].map(x=>{const mois=moisPourCible(x.val,total,grindMoyen);let ds='';if(mois!==null&&mois>0){const d=new Date();d.setMonth(d.getMonth()+mois);ds=d.toLocaleDateString('fr-FR',{month:'short',year:'numeric'});}return `<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg3);border-radius:10px;padding:10px 14px"><div style="font-size:13px;font-weight:900;font-family:var(--font-d);color:${x.color}">${x.label}</div><div style="text-align:right"><div style="font-size:14px;font-weight:900;font-family:var(--font-d);color:var(--text)">${mois===0?'✓ atteint':fmtDuree(mois)}</div>${ds?`<div style="font-size:9px;color:var(--text3);font-family:var(--font-mono)">${ds}</div>`:''}</div></div>`;}).join('')}</div>`;
    el.appendChild(projCard);
  }

  const msCard=document.createElement('div'); msCard.className='card';
  msCard.innerHTML='<div class="card-title">JALONS · RENTE NETTE / MOIS</div><div style="font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-bottom:16px">PEA après 5 ans : IR=0% · PS=17,2% sur plus-values</div>';
  [{label:'50 000€',val:50000,color:'#63b3ed',desc:'Premier cap'},{label:'100 000€',val:100000,color:'#a78bfa',desc:'Club des 6 chiffres'},{label:'250 000€',val:250000,color:'#f6e05e',desc:'Quart de million'},{label:'500 000€',val:500000,color:'#f6ad55',desc:'Demi-millionnaire'},{label:'1 000 000€',val:1000000,color:'#fc8181',desc:'Millionnaire'},{label:'FIRE · 1 600 000€',val:1600000,color:'#76e4f7',desc:'Indépendance financière'}].forEach((milestone,i,arr)=>{
    const reached=total>=milestone.val,p=pct(total,milestone.val),remaining=Math.max(milestone.val-total,0),rv=Math.round(rente(milestone.val)),isLast=i===arr.length-1;
    const j=document.createElement('div'); j.className='jalon'; if(isLast){j.style.paddingBottom='0';j.style.marginBottom='0';j.style.borderBottom='none';}
    j.innerHTML='<div class="jalon-top"><div><div class="jalon-name" style="color:'+(reached?milestone.color:'var(--text)')+'">'+milestone.label+(reached?'<span style="font-size:9px;background:'+milestone.color+'20;color:'+milestone.color+';padding:2px 7px;border-radius:4px;margin-left:6px;font-weight:700">✓</span>':'')+'</div><div style="font-size:10px;color:var(--text3);margin-top:2px">'+milestone.desc+'</div></div><div style="text-align:right;flex-shrink:0;margin-left:14px"><div class="jalon-rente" style="color:'+milestone.color+'">'+rv.toLocaleString('fr-FR')+'€</div><div style="font-size:9px;color:var(--text3);font-family:var(--font-mono)">/mois net</div></div></div><div class="jalon-track"><div class="jalon-fill" style="width:'+p.toFixed(1)+'%;background:linear-gradient(90deg,'+milestone.color+'55,'+milestone.color+')"></div></div><div class="jalon-meta"><span>'+p.toFixed(1)+'%</span><span>'+(reached?'atteint 🎯':'encore '+remaining.toLocaleString('fr-FR')+'€')+'</span></div>';
    msCard.appendChild(j);
  });
  el.appendChild(msCard);
}

  const groupsHTML=platforms.map(p=>'<div class="platform-group"><div class="platform-label" style="color:'+p.color+'">'+p.name+'</div>'+p.fields.map(f=>'<div class="platform-field-row"><div class="platform-field-name">'+f.label+'</div><input type="number" inputmode="decimal" class="platform-field-input" id="mg_'+f.key+'" placeholder="'+(f.val||0)+'" value="'+(f.val||'')+'"></div>').join('')+'</div>').join('');
  sheet.innerHTML='<div class="modal-title">✎ Mise à jour mensuelle</div><div class="modal-sub">Par plateforme · laisse vide si inchangé</div>'+groupsHTML+'<div class="btns" style="margin-top:6px"><button class="btn btn-cancel" onclick="closeModal()">Annuler</button><button class="btn btn-ok" onclick="confirmModalGrouped()">Enregistrer ✓</button></div>';
  document.getElementById('modalOverlay').classList.add('show');
}
function confirmModalGrouped() {
  const read=(id,fb)=>{ const el=document.getElementById(id); if(!el||el.value==='') return fb; const v=parseFloat(el.value.replace(',','.')); return isNaN(v)?fb:v; };
  Object.keys(state.pea).forEach(k=>{ state.pea[k].value=read('mg_pea_'+k,state.pea[k].value); });
  Object.keys(state.actions).forEach(k=>{ state.actions[k].value=read('mg_act_'+k,state.actions[k].value); });
  Object.keys(state.banques).forEach(k=>{ state.banques[k].value=read('mg_banq_'+k,state.banques[k].value); });
  Object.keys(state.crypto).forEach(k=>{ state.crypto[k].value=read('mg_crypto_'+k,state.crypto[k].value); });
  closeModal(); finalize();
}

// ─── INPUT RAPIDE PATRIMOINE ──────────────────────────────────────────────────
function openInput(key) {
  inputKey=key; let name='',current=0;
  if(key.startsWith('pea_')){const k=key.slice(4);name=state.pea[k].label;current=state.pea[k].value;}
  if(key.startsWith('act_')){const k=key.slice(4);name=state.actions[k].label;current=state.actions[k].value;}
  if(key.startsWith('banq_')){const k=key.slice(5);name=state.banques[k].label;current=state.banques[k].value;}
  if(key.startsWith('crypto_')){const k=key.slice(7);name=state.crypto[k].label;current=state.crypto[k].value;}
  document.getElementById('fieldName').textContent=name;
  document.getElementById('fieldHint').textContent='Valeur actuelle : '+fmt(current);
  document.getElementById('field').value=current||'';
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>document.getElementById('field').focus(),120);
}
function closeInput(){document.getElementById('overlay').classList.remove('show');document.getElementById('field').value='';inputKey=null;}
function handleBg(e){if(e.target===document.getElementById('overlay'))closeInput();}
function confirmInput(){
  const val=parseFloat(document.getElementById('field').value.replace(',','.'));
  if(isNaN(val)||val<0){closeInput();return;}
  const key=inputKey;
  if(key.startsWith('pea_'))state.pea[key.slice(4)].value=val;
  if(key.startsWith('act_'))state.actions[key.slice(4)].value=val;
  if(key.startsWith('banq_'))state.banques[key.slice(5)].value=val;
  if(key.startsWith('crypto_'))state.crypto[key.slice(7)].value=val;
  finalize();
}
document.getElementById('field').addEventListener('keydown',e=>{if(e.key==='Enter')confirmInput();});
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
function handleModalBg(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}
function finalize(){state.lastUpdate=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});pushHistory();save();closeInput();render();}

// ─── STARS ───────────────────────────────────────────────────────────────────
function initStars(){const el=document.getElementById('stars');for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*1.8+0.4;s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;--d:'+(2+Math.random()*5)+'s;--o:'+(0.2+Math.random()*0.5)+';animation-delay:'+Math.random()*5+'s';el.appendChild(s);}}

initStars();
initState();

// ─── SWIPE ────────────────────────────────────────────────────────────────────
(function(){
  let sx=0,sy=0,t=0;
  const el=document.getElementById('content');
  el.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; t=Date.now(); },{passive:true});
  el.addEventListener('touchend',e=>{
    if(view!=='budget')return;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy, dt=Date.now()-t;
    // Swipe horizontal franc et rapide uniquement : |dx|>70, |dx| > 2.5*|dy|, durée < 600ms
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*2.5 && dt<600){ if(dx<0)nextMonth(); else prevMonth(); }
  },{passive:true});
})();
</script>
