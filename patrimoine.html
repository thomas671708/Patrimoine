<style>
:root {
  --bg:     #08080f;
  --bg2:    #0f0f1a;
  --bg3:    #161622;
  --bg4:    #1e1e2e;
  --border: rgba(255,255,255,0.06);
  --text:   #eeeef8;
  --text2:  #9898b8;
  --text3:  #565670;
  --cyan:   #5ee7df;
  --blue:   #4d9fff;
  --blue2:  #2563eb;
  --purple: #a78bfa;
  --green:  #4ade80;
  --red:    #f87171;
  --yellow: #fbbf24;
  --orange: #fb923c;
  --font-d: 'Syne', sans-serif;
  --font-m: 'Manrope', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-m); }
#stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--d) ease-in-out infinite alternate; opacity: var(--o); }
@keyframes twinkle { from { opacity: var(--o); } to { opacity: calc(var(--o) * 0.2); } }
#app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100dvh; }
#content { flex: 1; overflow-y: auto; padding: 20px 16px 8px; -webkit-overflow-scrolling: touch; }
#content::-webkit-scrollbar { display: none; }
#nav { display: flex; background: var(--bg2); border-top: 1px solid var(--border); padding: 10px 8px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 4px; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border: none; background: none; color: var(--text3); cursor: pointer; border-radius: 12px; transition: all 0.2s; }
.nav-btn.active { color: var(--cyan); background: rgba(94,231,223,0.07); }
.nav-icon { font-size: 19px; }
.nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; font-family: var(--font-m); }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 12px; animation: up 0.3s cubic-bezier(.4,0,.2,1) both; }
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(6){animation-delay:.25s}
@keyframes up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
.card-title { font-size: 9px; letter-spacing: 0.18em; color: var(--text3); font-weight: 700; font-family: var(--font-mono); margin-bottom: 14px; text-transform: uppercase; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.row-left { display: flex; align-items: center; gap: 10px; }
.row-name { font-size: 13px; font-weight: 600; color: var(--text2); }
.row-val { font-size: 15px; font-weight: 900; font-family: var(--font-d); color: var(--text); cursor: pointer; border-bottom: 1px dashed var(--text3); transition: color .15s; }
.row-val:active { color: var(--cyan); }
.bar-wrap { margin-bottom: 12px; }
.bar-wrap:last-child { margin-bottom: 0; }
.bar-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
.bar-name { font-size: 11px; font-weight: 700; color: var(--text2); }
.bar-val { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }
.bar-track { height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .9s cubic-bezier(.4,0,.2,1); }
.jalon { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.jalon:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: none; }
.jalon-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.jalon-name { font-size: 13px; font-weight: 900; font-family: var(--font-d); }
.jalon-rente { font-size: 20px; font-weight: 900; font-family: var(--font-d); }
.jalon-track { height: 5px; background: var(--bg4); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
.jalon-fill { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(.4,0,.2,1); }
.jalon-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); font-family: var(--font-mono); }
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(10px); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s; }
#overlay.show { opacity: 1; pointer-events: all; }
.sheet { background: var(--bg2); border-radius: 26px 26px 0 0; border: 1px solid var(--border); border-bottom: none; padding: 28px 20px 36px; width: 100%; }
.sheet-title { font-size: 20px; font-weight: 900; font-family: var(--font-d); margin-bottom: 4px; }
.sheet-hint { font-size: 12px; color: var(--text3); margin-bottom: 22px; font-family: var(--font-mono); }
#field { width: 100%; background: var(--bg3); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px; font-size: 28px; font-family: var(--font-d); font-weight: 900; color: var(--cyan); outline: none; -webkit-appearance: none; transition: border-color .2s; }
#field:focus { border-color: var(--cyan); }
.btns { display: flex; gap: 10px; margin-top: 14px; }
.btn { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 15px; font-weight: 900; font-family: var(--font-d); cursor: pointer; }
.btn-cancel { background: var(--bg4); color: var(--text3); }
.btn-ok { background: var(--cyan); color: var(--bg); }
#modalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); z-index: 200; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s; }
#modalOverlay.show { opacity: 1; pointer-events: all; }
.modal-sheet { background: var(--bg2); border-radius: 26px 26px 0 0; border: 1px solid var(--border); border-bottom: none; padding: 24px 20px 36px; width: 100%; max-height: 90dvh; overflow-y: auto; }
.modal-sheet::-webkit-scrollbar { display: none; }
.modal-title { font-size: 22px; font-weight: 900; font-family: var(--font-d); margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--text3); margin-bottom: 20px; }
.modal-group { margin-bottom: 18px; }
.modal-group-title { font-size: 9px; letter-spacing: .15em; color: var(--text3); font-weight: 700; font-family: var(--font-mono); margin-bottom: 10px; text-transform: uppercase; }
.modal-field-wrap { margin-bottom: 10px; }
.modal-field-label { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 4px; display: flex; justify-content: space-between; }
.modal-field-label span { color: var(--text3); font-family: var(--font-mono); font-weight: 400; }
.modal-field { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 16px; font-family: var(--font-d); font-weight: 700; color: var(--cyan); outline: none; -webkit-appearance: none; }
.modal-field:focus { border-color: var(--cyan); }
select.modal-field { color: var(--cyan); }

/* Platform group styling */
.platform-group { background: var(--bg3); border-radius: 14px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
.platform-label { font-size: 10px; letter-spacing: .12em; color: var(--cyan); font-weight: 700; font-family: var(--font-mono); margin-bottom: 12px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.platform-label::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
.platform-field-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.platform-field-row:last-child { margin-bottom: 0; }
.platform-field-name { font-size: 12px; font-weight: 600; color: var(--text2); flex: 1; min-width: 0; }
.platform-field-input { width: 110px; flex-shrink: 0; background: var(--bg4); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 15px; font-family: var(--font-d); font-weight: 700; color: var(--cyan); outline: none; -webkit-appearance: none; text-align: right; }
.platform-field-input:focus { border-color: var(--cyan); }

/* Prefill modal */
.prefill-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.prefill-row:last-child { border-bottom: none; }
.prefill-check { width: 20px; height: 20px; accent-color: var(--cyan); cursor: pointer; flex-shrink: 0; }
.prefill-label { flex: 1; font-size: 12px; font-weight: 600; color: var(--text2); }
.prefill-cat { font-size: 9px; color: var(--text3); font-family: var(--font-mono); }
.prefill-amount { width: 80px; flex-shrink: 0; background: var(--bg4); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 14px; font-family: var(--font-d); font-weight: 700; color: var(--cyan); outline: none; text-align: right; }
.prefill-amount:focus { border-color: var(--cyan); }

/* SNCF badge */
.sncf-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(251,191,36,0.12); color: var(--yellow); border-radius: 6px; padding: 2px 7px; font-size: 9px; font-family: var(--font-mono); font-weight: 700; margin-top: 4px; }
</style>
</head>

async function supaFetch(path, opts={}) {
  const {headers: extraHeaders={}, ...restOpts} = opts;
  const res = await fetch(SUPA_URL+'/rest/v1/'+path, {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer '+SUPA_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal', ...extraHeaders },
    ...restOpts
  });

async function loadFromCloud() {
  try {

    if (rows && rows.length) return rows[0].data;
  } catch(e) { console.warn('Cloud load failed', e); }

}
async function saveToCloud(s) {
  const date = new Date().toISOString().slice(0,10);
  try {
    await supaFetch('snapshots', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ date, data: s })
    });
  } catch(e) { console.warn('Cloud save failed', e); }
  localStorage.setItem('pat3', JSON.stringify(s));
}

let state = JSON.parse(JSON.stringify(DEFAULTS));
let view = 'dashboard';
let inputKey = null;

function loadState() {
  try { const s=localStorage.getItem('pat3'); return s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULTS)); }
  catch { return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save() {
  localStorage.setItem('pat3', JSON.stringify(state));
  saveToCloud(state).catch(()=>{});
}
async function initState() {
  const FIXED_MONTHS = Object.keys(DEFAULTS.budget || {});
  state = loadState();
  if (!state.budget) state.budget = {};
  FIXED_MONTHS.forEach(month => {
    state.budget[month] = JSON.parse(JSON.stringify(DEFAULTS.budget[month]));
  });
  render();
  showSyncStatus('⏳ Sync cloud…');
  try {
    const cloud = await loadFromCloud();
    if (cloud) {
      if (cloud.history && cloud.history.length >= (state.history||[]).length) {
        const cloudBudget = cloud.budget || {};
        const mergedBudget = { ...cloudBudget };
        FIXED_MONTHS.forEach(month => {
          mergedBudget[month] = JSON.parse(JSON.stringify(DEFAULTS.budget[month]));
        });
        state = { ...state, ...cloud };
        state.budget = mergedBudget;
      }
      showSyncStatus('☁️ Sync OK', 2000);
      render();
    } else {
      showSyncStatus('📱 Local only', 1500);
    }
  } catch {
    showSyncStatus('⚠️ Offline', 2000);
  }
  save();
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
const fmt = v => {
  if (v===null||v===undefined) return '—';
  const abs = Math.abs(v);
  const n = abs % 1 === 0 ? abs.toLocaleString('fr-FR') : abs.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (v<0?'-':'')+n+'€';
};
const pct = (a,b) => b>0 ? Math.min((a/b)*100,100) : 0;
function getCurrentMonthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getMonthLabel(key) {
  const [y,m] = key.split('-');
  const months = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  return months[parseInt(m)-1]+' '+y.slice(2);
}
function getBudgetMonth(key) {
  if (!state.budget) state.budget = {};
  if (!state.budget[key]) state.budget[key] = { depenses:[], revenus:[], invests:[], ciel:[], remboursements:[] };
  if (!state.budget[key].remboursements) state.budget[key].remboursements = [];
  return state.budget[key];
}
function budgetStats(key) {
  const m = getBudgetMonth(key);
  const totalRevenu  = m.revenus.reduce((s,r)=>s+r.montant,0);
  const totalDepense = m.depenses.reduce((s,d)=>s+d.montant,0);
  const totalRemb    = (m.remboursements||[]).reduce((s,r)=>s+r.montant,0);
  const totalDepNette= totalDepense - totalRemb;
  const investPoche  = m.invests.reduce((s,i)=>s+i.montant,0);
  const totalCiel    = m.ciel.reduce((s,c)=>s+c.montant,0);
  const totalInvest  = investPoche + totalCiel;
  const savings      = totalRevenu - totalDepNette - investPoche;
  const grind        = savings + totalInvest;
  return { totalRevenu, totalDepense, totalRemb, totalDepNette, investPoche, totalCiel, totalInvest, savings, grind };
}

function getBanques() { return Object.values(state.banques).reduce((s,a)=>s+a.value,0); }

function getTotal()   { return getBanques() + getActions() + getCrypto(); }
function getWorld()   {
  const peaW = Object.values(state.pea).filter(e=>e.isWorld).reduce((s,e)=>s+e.value,0);
  return peaW + state.actions.epSal.value;
}
function getEM()    { return state.pea.em.value; }
function rente(cap) { return cap*0.04*(1-0.6*0.172)/12; }
function todayLabel() { return new Date().toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}); }
function pushHistory() {
  const d = todayLabel(), t = getTotal();
  state.history = state.history.filter(h=>h.date!==d);
  state.history.push({date:d,total:t});

}

  cryptoCard.innerHTML=`<div class="card-title">CRYPTO · ${fmt(getCrypto())}</div><div class="row"><div><div class="row-name">${state.crypto.btc.label}</div><div style="font-size:10px;margin-top:2px;color:${isOver?'var(--orange)':'var(--text3)'}">  ${cryptoPct}% du patrimoine ${isOver?'⚠️ > 15%':'✓ < 15%'}</div></div><div class="row-val" onclick="openInput('crypto_btc')">${fmt(state.crypto.btc.value)}</div></div>`;

      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:13px;font-weight:900;font-family:var(--font-d);color:var(--cyan)">🗓️ Mois vierge</div>

      </div>`;
    el.appendChild(prefillBanner);
  }

  const gc=s.grind>=0?'var(--cyan)':'var(--red)', sc=s.savings>=0?'var(--green)':'var(--red)';
  const grindCard=document.createElement('div'); grindCard.className='card';
  grindCard.innerHTML=`<div class="card-title">GRIND DU MOIS</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:38px;font-weight:900;font-family:var(--font-d);color:${gc}">${s.grind>=0?'+':''}${Math.round(s.grind).toLocaleString('fr-FR')}€</div>
      <div style="text-align:right;font-size:10px;font-family:var(--font-mono);color:var(--text3);line-height:2">
        <div>saving <span style="color:${sc};font-weight:700">${s.savings>=0?'+':''}${Math.round(s.savings).toLocaleString('fr-FR')}€</span></div>
        <div>invest <span style="color:var(--blue);font-weight:700">+${Math.round(s.totalInvest).toLocaleString('fr-FR')}€</span></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px">
      ${[{l:'Revenus',v:s.totalRevenu,c:'var(--green)'},{l:'Dép. nettes',v:-s.totalDepNette,c:'var(--red)'},{l:'Invest',v:s.investPoche,c:'var(--blue)'},{l:'Tombés ciel',v:s.totalCiel,c:'var(--yellow)'}].map(x=>`<div style="background:var(--bg3);border-radius:10px;padding:8px;text-align:center"><div style="font-size:9px;color:var(--text3);margin-bottom:4px">${x.l}</div><div style="font-size:13px;font-weight:900;font-family:var(--font-d);color:${x.c}">${x.v>=0?'+':''}${Math.round(x.v).toLocaleString('fr-FR')}€</div></div>`).join('')}
    </div>
    ${s.totalRemb>0?`<div style="font-size:10px;color:var(--green);font-family:var(--font-mono);margin-top:10px">↩ ${fmt(s.totalRemb)} remboursés · dép. brutes ${fmt(s.totalDepense)}</div>`:''}`;
  el.appendChild(grindCard);

  if (m.revenus.length) {
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="card-title">REVENUS · ${fmt(s.totalRevenu)}</div>`;
    m.revenus.forEach((r,i)=>{ const row=document.createElement('div'); row.className='row'; row.innerHTML=`<div><div class="row-name">${r.type}</div>${r.note?`<div style="font-size:10px;color:var(--text3)">${r.note}</div>`:''}</div><div style="display:flex;align-items:center;gap:10px"><div class="row-val" style="color:var(--green);cursor:pointer;border-bottom:1px dashed var(--green)" onclick="editEntry('revenus',${i})">+${fmt(r.montant)}</div><button onclick="delEntry('revenus',${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px">✕</button></div>`; c.appendChild(row); });

    const ci=BUDGET_CATS[cat]||{label:cat,color:'var(--text3)'};
    const tot=items.reduce((s,d)=>s+d.montant,0);
    const rembDeCat=(m.remboursements||[]).filter(r=>r.cat===cat);

    const totNet=tot-totRemb;
    const c=document.createElement('div'); c.className='card';

    c.innerHTML=`<div class="card-title" style="color:${ci.color}">${ci.label} · ${fmt(tot)}${titleExtra}</div>`;
    items.forEach(d=>{
      const idx=m.depenses.indexOf(d);
      const row=document.createElement('div'); row.className='row';
      const sncfBadge = d.isSNCF && !d.sncfCorrected ? `<div class="sncf-badge">🚆 90% remb. base 87,60€ · net ${fmt(SNCF_NET)} après salaire</div>` : d.isSNCF && d.sncfCorrected ? `<div class="sncf-badge" style="background:rgba(74,222,128,0.1);color:var(--green)">✓ SNCF corrigé · ${fmt(d.montant)} net</div>` : '';
      row.innerHTML=`<div><div class="row-name">${d.sous_cat||'—'}</div>${sncfBadge}${d.note&&!d.isSNCF?`<div style="font-size:10px;color:var(--text3)">${d.note}</div>`:''}</div><div style="display:flex;align-items:center;gap:10px"><div class="row-val" style="color:var(--red);cursor:pointer;border-bottom:1px dashed var(--red)" onclick="editEntry('depenses',${idx})">-${fmt(d.montant)}</div><button onclick="delEntry('depenses',${idx})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px">✕</button></div>`;
      c.appendChild(row);
    });
    rembDeCat.forEach(r=>{
      const ridx=(m.remboursements||[]).indexOf(r);
      const rrow=document.createElement('div'); rrow.className='row';
      rrow.innerHTML=`<div><div class="row-name" style="color:var(--green)">↩ ${ci.rembLabel||'Remboursement'}</div>${r.note?`<div style="font-size:10px;color:var(--text3)">${r.note}</div>`:''}</div><div style="display:flex;align-items:center;gap:10px"><div class="row-val" style="color:var(--green);cursor:pointer;border-bottom:1px dashed var(--green)" onclick="editEntry('remboursements',${ridx})">+${fmt(r.montant)}</div><button onclick="delEntry('remboursements',${ridx})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px">✕</button></div>`;
      c.appendChild(rrow);
    });
    el.appendChild(c);
  });

  if (!m.depenses.length && !m.revenus.length && !m.invests.length && !m.ciel.length) {
    const empty=document.createElement('div'); empty.className='card';
    empty.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3)">Aucune entrée ce mois.<br>Clique sur <b>Remplir →</b> ou <b>+ Ajouter</b>.</div>';
    el.appendChild(empty);
  }
}

function prevMonth() {
  const [y,m]=budgetMonth.split('-').map(Number), d=new Date(y,m-2,1);
  budgetMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function nextMonth() {
  const [y,m]=budgetMonth.split('-').map(Number), d=new Date(y,m,1);
  budgetMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function delEntry(type, idx) {
  getBudgetMonth(budgetMonth)[type].splice(idx,1);
  save(); render();
}
function editEntry(type, idx) {
  const m = getBudgetMonth(budgetMonth);
  const entry = m[type][idx];
  const sheet = document.getElementById('modalSheet');
  const label = type==='depenses' ? (entry.sous_cat||entry.cat) : type==='remboursements' ? '↩ Remboursement' : (entry.type||type);
  sheet.innerHTML=`
    <div class="modal-title">Modifier le montant</div>
    <div class="modal-sub">${label}${entry.note?' · '+entry.note:''}</div>
    <div class="modal-field-wrap">
      <div class="modal-field-label">Nouveau montant (€)<span>actuel : ${fmt(entry.montant)}</span></div>
      <input class="modal-field" type="number" inputmode="decimal" id="edit_montant" value="${entry.montant}" placeholder="${entry.montant}">
    </div>
    <div class="btns">
      <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn btn-ok" onclick="confirmEdit('${type}',${idx})">Valider ✓</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('edit_montant')?.select(),120);
}
function confirmEdit(type, idx) {
  const val = parseFloat((document.getElementById('edit_montant')?.value||'0').replace(',','.'));
  if (isNaN(val)||val<0) { closeModal(); return; }
  getBudgetMonth(budgetMonth)[type][idx].montant = val;
  save(); closeModal(); render();
}

// ─── PREFILL MODAL ────────────────────────────────────────────────────────────
function openPrefillModal() {
  // Calculer la clé du mois précédent
  const [y, m] = budgetMonth.split('-').map(Number);
  const prevDate = new Date(y, m - 2, 1);
  const prevKey = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
  const prevMonth = state.budget?.[prevKey];

  const sheet = document.getElementById('modalSheet');
  const rows = RECURRING_EXPENSES.map((exp, i) => {
    const ci = BUDGET_CATS[exp.cat];

    // Chercher le montant du mois précédent pour ce cat + sous_cat
    let montantSuggere = exp.montant;
    let fromPrev = false;
    if (prevMonth?.depenses) {
      const match = prevMonth.depenses.find(
        d => d.cat === exp.cat && d.sous_cat === exp.sous_cat
      );
      if (match) {
        montantSuggere = match.montant;
        fromPrev = true;
      }
    }

    const sncfInfo = exp.isSNCF
      ? `<div class="sncf-badge" style="margin-top:2px">90% remb. · net ${fmt(SNCF_NET)} après salaire</div>`
      : '';
    const prevBadge = fromPrev
      ? `<div style="font-size:9px;color:var(--cyan);font-family:var(--font-mono);margin-top:2px">↩ ${getMonthLabel(prevKey)}</div>`
      : `<div style="font-size:9px;color:var(--text3);font-family:var(--font-mono);margin-top:2px">défaut</div>`;

    return `
      <div class="prefill-row">
        <input type="checkbox" class="prefill-check" id="pf_check_${i}" checked>
        <div class="prefill-label">
          <div>${exp.sous_cat}</div>
          <div class="prefill-cat">${ci?.label || exp.cat}</div>
          ${sncfInfo}
          ${prevBadge}
        </div>
        <input type="number" inputmode="decimal" class="prefill-amount" id="pf_amt_${i}" value="${montantSuggere}">
      </div>`;
  }).join('');

  const subTitle = prevMonth
    ? `Montants repris du mois précédent (${getMonthLabel(prevKey)}) · modifie si besoin`
    : `Aucun mois précédent · montants par défaut`;

  sheet.innerHTML = `
    <div class="modal-title">🗓️ Dépenses récurrentes</div>
    <div class="modal-sub">${subTitle}</div>
    ${rows}
    <div class="btns" style="margin-top:18px">
      <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn btn-ok" onclick="confirmPrefill()">Importer ✓</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
}

function showSncfCorrectionToast(brut, corrige) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid rgba(74,222,128,0.3);border-radius:16px;padding:12px 18px;font-size:11px;font-family:var(--font-mono);color:var(--green);z-index:999;text-align:center;line-height:1.8;animation:up .3s ease both;max-width:300px`;
  t.innerHTML = `✓ Salaire corrigé<br><span style="color:var(--text3)">${fmt(brut)} → <b style="color:var(--cyan)">${fmt(corrige)}</b> (−${fmt(SNCF_REMB_MONTANT)} SNCF)</span><br><span style="color:var(--text3)">Dépense SNCF réduite à <b style="color:var(--green)">${fmt(SNCF_NET)}</b></span>`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

function confirmPrefill() {
  const m = getBudgetMonth(budgetMonth);
  if (!m.remboursements) m.remboursements = [];

  RECURRING_EXPENSES.forEach((exp, i) => {
    const checked = document.getElementById(`pf_check_${i}`)?.checked;
    if (!checked) return;
    const rawAmt = parseFloat(document.getElementById(`pf_amt_${i}`)?.value || exp.montant);
    if (isNaN(rawAmt) || rawAmt < 0) return;
    const montant = rawAmt;

    m.depenses.push({
      montant,
      cat: exp.cat,
      sous_cat: exp.sous_cat,
      note: exp.note || '',
      isSNCF: exp.isSNCF || false,
      sncfCorrected: false,
    });
  });

  // Participation Loïc logement : remb automatique
  const loicExists = m.remboursements.some(r => r.note && r.note.includes('Loïc'));
  if (!loicExists) {
    const loyer = m.depenses.find(d => d.cat === 'logement' && d.sous_cat === 'Loyer Oberhausbergen');
    if (loyer) {
      m.remboursements.push({
        montant: 615,
        cat: 'logement',
        note: 'Participation Loïc',
      });
    }
  }

  save(); closeModal(); render();
}

function renderStats(el) {
  const hd=document.createElement('div'); hd.style.cssText='margin-bottom:20px';

    const e=document.createElement('div'); e.className='card';
    e.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3)">Pas encore de données budget.</div>';
    el.appendChild(e); return;
  }
  const recapCard=document.createElement('div'); recapCard.className='card';
  recapCard.innerHTML='<div class="card-title">RÉCAP MENSUEL</div>';
  const thead=document.createElement('div');
  thead.style.cssText='display:grid;grid-template-columns:55px 1fr 1fr 1fr 1fr;gap:4px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)';
  thead.innerHTML=['Mois','Revenus','Dép.','Saving','GRIND'].map(h=>`<div style="font-size:9px;color:var(--text3);font-family:var(--font-mono);font-weight:700;text-align:right">${h}</div>`).join('');
  thead.firstElementChild.style.textAlign='left';
  recapCard.appendChild(thead);
  let tg=0,tr=0,td=0,ts=0;
  keys.forEach(key=>{
    const s=budgetStats(key); tg+=s.grind; tr+=s.totalRevenu; td+=s.totalDepNette; ts+=s.savings;
    const row=document.createElement('div');
    row.style.cssText='display:grid;grid-template-columns:55px 1fr 1fr 1fr 1fr;gap:4px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer';
    row.onclick=()=>{ budgetMonth=key; setView('budget'); };
    const gc=s.grind>=0?'var(--cyan)':'var(--red)', sc=s.savings>=0?'var(--green)':'var(--red)';
    row.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--text2)">${getMonthLabel(key)}</div><div style="font-size:11px;font-family:var(--font-mono);color:var(--green);text-align:right">${Math.round(s.totalRevenu).toLocaleString('fr-FR')}</div><div style="font-size:11px;font-family:var(--font-mono);color:var(--red);text-align:right">-${Math.round(s.totalDepNette).toLocaleString('fr-FR')}</div><div style="font-size:11px;font-family:var(--font-mono);color:${sc};text-align:right">${s.savings>=0?'+':''}${Math.round(s.savings).toLocaleString('fr-FR')}</div><div style="font-size:13px;font-weight:900;font-family:var(--font-d);color:${gc};text-align:right">${s.grind>=0?'+':''}${Math.round(s.grind).toLocaleString('fr-FR')}</div>`;
    recapCard.appendChild(row);
  });
  const totRow=document.createElement('div');
  totRow.style.cssText='display:grid;grid-template-columns:55px 1fr 1fr 1fr 1fr;gap:4px;padding:8px 0 0;margin-top:4px';
  const tgc=tg>=0?'var(--cyan)':'var(--red)';
  totRow.innerHTML=`<div style="font-size:10px;font-weight:900;color:var(--text3)">TOTAL</div><div style="font-size:11px;font-family:var(--font-mono);color:var(--green);text-align:right;font-weight:700">${Math.round(tr).toLocaleString('fr-FR')}</div><div style="font-size:11px;font-family:var(--font-mono);color:var(--red);text-align:right;font-weight:700">-${Math.round(td).toLocaleString('fr-FR')}</div><div style="font-size:11px;font-family:var(--font-mono);color:var(--green);text-align:right;font-weight:700">${ts>=0?'+':''}${Math.round(ts).toLocaleString('fr-FR')}</div><div style="font-size:14px;font-weight:900;font-family:var(--font-d);color:${tgc};text-align:right">${tg>=0?'+':''}${Math.round(tg).toLocaleString('fr-FR')}</div>`;
  recapCard.appendChild(totRow);
  el.appendChild(recapCard);

  const allDeps={};
  keys.forEach(key=>{ getBudgetMonth(key).depenses.forEach(d=>{ allDeps[d.cat]=(allDeps[d.cat]||0)+d.montant; }); });
  if (Object.keys(allDeps).length) {
    const totalDepsAll=Object.values(allDeps).reduce((s,v)=>s+v,0);
    const catCard=document.createElement('div'); catCard.className='card';
    catCard.innerHTML='<div class="card-title">RÉPARTITION DÉPENSES</div>';
    Object.entries(allDeps).sort((a,b)=>b[1]-a[1]).forEach(([cat,total])=>{
      const ci=BUDGET_CATS[cat]||{label:cat,color:'var(--text3)'};
      const p=Math.round(total/totalDepsAll*100);
      const bw=document.createElement('div'); bw.className='bar-wrap';
      bw.innerHTML=`<div class="bar-header"><div class="bar-name">${ci.label}</div><div class="bar-val">${p}% · ${fmt(total)}</div></div><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${ci.color}88"></div></div>`;
      catCard.appendChild(bw);
    });
    el.appendChild(catCard);
  }
}

// ─── BUDGET MODAL ─────────────────────────────────────────────────────────────
let budgetModalType = 'depense';

function openBudgetModal() {
  budgetModalType = 'depense';
  document.getElementById('modalSheet').innerHTML = buildBudgetHTML();
  document.getElementById('modalOverlay').classList.add('show');
}
function switchTab(t) {

  document.getElementById('modalSheet').innerHTML=buildBudgetHTML();

function updateSousCats() {
  const cat=document.getElementById('bm_cat')?.value;
  const sel=document.getElementById('bm_souscat');
  if (sel && cat && BUDGET_CATS[cat]) sel.innerHTML=BUDGET_CATS[cat].subs.map(s=>`<option>${s}</option>`).join('');
}
function confirmBudget() {
  const montant=parseFloat((document.getElementById('bm_montant')?.value||'0').replace(',','.'));
  if (!montant||montant<=0){closeModal();return;}
  const note=document.getElementById('bm_note')?.value||'';
  const m=getBudgetMonth(budgetMonth);
  if (!m.remboursements) m.remboursements=[];

  if (budgetModalType==='depense') {
    const cat=document.getElementById('bm_cat').value;
    const sous_cat=document.getElementById('bm_souscat')?.value||'';
    const isSNCF = sous_cat === 'SNCF';
    m.depenses.push({montant,cat,sous_cat,note,isSNCF,sncfCorrected:false});
  } else if (budgetModalType==='revenu') {
    const type = document.getElementById('bm_type').value;
    if (type === 'Salaire') {
      const sncfDep = m.depenses.find(d => d.isSNCF);
      const alreadyCorrected = m.revenus.some(r => r.sncfCorrected);
      if (sncfDep && !alreadyCorrected) {
        const salaireBrut = montant;
        const salaireCorrige = Math.round((montant - SNCF_REMB_MONTANT) * 100) / 100;
        sncfDep.montant = SNCF_NET;
        sncfDep.note = `Net après remb. employeur 90% (base 87,60€ · remb. ${fmt(SNCF_REMB_MONTANT)})`;
        sncfDep.sncfCorrected = true;
        m.revenus.push({
          montant: salaireCorrige,
          type,
          note: note || `Salaire corrigé · −${fmt(SNCF_REMB_MONTANT)} remb. SNCF inclus (brut saisi : ${fmt(salaireBrut)})`,
          sncfCorrected: true,
        });
        save(); closeModal();
        showSncfCorrectionToast(salaireBrut, salaireCorrige);
        render();
        return;
      } else {
        m.revenus.push({montant, type, note});
      }
    } else {
      m.revenus.push({montant, type, note});
    }
  } else if (budgetModalType==='invest') {
    m.invests.push({montant,type:document.getElementById('bm_type').value,note});
  } else if (budgetModalType==='remb') {
    const cat=document.getElementById('bm_remb_cat').value;
    m.remboursements.push({montant,cat,note});
  } else {
    m.ciel.push({montant,type:document.getElementById('bm_type').value,note});
  }
  save(); closeModal(); render();
}

// ─── HISTORIQUE ───────────────────────────────────────────────────────────────
function renderHistorique(el) {
  const hd=document.createElement('div'); hd.style.cssText='margin-bottom:20px';
  hd.innerHTML=`<div style="font-size:24px;font-weight:900;font-family:var(--font-d)">Historique</div><div style="font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-top:2px">${state.history.length} points de données</div>`;
  el.appendChild(hd);
  if (!state.history.length) { const c=document.createElement('div'); c.className='card'; c.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3)">Pas encore de données.</div>'; el.appendChild(c); return; }
  const chartCard=document.createElement('div'); chartCard.className='card';
  chartCard.innerHTML='<div class="card-title">ÉVOLUTION DU PATRIMOINE</div>';
  const hist=state.history.slice(-12), maxH=Math.max(...hist.map(h=>h.total));
  const barWrap=document.createElement('div'); barWrap.style.cssText='display:flex;align-items:flex-end;gap:5px;height:90px;margin-bottom:10px';
  hist.forEach((h,i,arr)=>{
    const hpct=(h.total/maxH)*88, prev=arr[i-1], isUp=!prev||h.total>=prev.total;
    const col=document.createElement('div'); col.style.cssText='flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%';
    col.innerHTML=`<div style="width:100%;height:${hpct}%;background:${isUp?'linear-gradient(to top,var(--blue2),var(--cyan))':'linear-gradient(to top,#7f1d1d,var(--red))'};border-radius:3px 3px 0 0;min-height:3px"></div><div style="font-size:7px;color:var(--text3);font-family:var(--font-mono);text-align:center;line-height:1.2">${h.date}</div>`;
    barWrap.appendChild(col);
  });
  chartCard.appendChild(barWrap); el.appendChild(chartCard);
  const tableCard=document.createElement('div'); tableCard.className='card'; tableCard.innerHTML='<div class="card-title">DÉTAIL</div>';
  [...hist].reverse().forEach((h,i,arr)=>{
    const prev=arr[i+1], diff=prev?h.total-prev.total:null;
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div><div style="font-size:14px;font-weight:700;font-family:var(--font-d);color:var(--text2)">${h.date}</div>${diff!==null?`<div style="font-size:10px;color:${diff>=0?'var(--green)':'var(--red)'};font-family:var(--font-mono)">${diff>=0?'+':''}${Math.round(diff).toLocaleString('fr-FR')}€ vs avant</div>`:''}</div><div style="font-size:18px;font-weight:900;font-family:var(--font-d);color:var(--text)">${fmt(h.total)}</div>`;
    tableCard.appendChild(row);
  });
  el.appendChild(tableCard);
}

  Object.keys(state.pea).forEach(k => {

  });
  Object.keys(state.actions).forEach(k => {
    state.actions[k].value = read('mg_act_' + k, state.actions[k].value);
  });
  Object.keys(state.banques).forEach(k => {
    state.banques[k].value = read('mg_banq_' + k, state.banques[k].value);

  Object.keys(state.crypto).forEach(k => {

}

// ─── INPUT RAPIDE ─────────────────────────────────────────────────────────────
function openInput(key) {
  inputKey=key;
  let name='', current=0;
  if(key.startsWith('pea_'))   { const k=key.slice(4); name=state.pea[k].label;    current=state.pea[k].value; }
  if(key.startsWith('act_'))   { const k=key.slice(4); name=state.actions[k].label; current=state.actions[k].value; }
  if(key.startsWith('banq_'))  { const k=key.slice(5); name=state.banques[k].label; current=state.banques[k].value; }
  if(key.startsWith('crypto_')){ const k=key.slice(7); name=state.crypto[k].label;  current=state.crypto[k].value; }
  document.getElementById('fieldName').textContent=name;
  document.getElementById('fieldHint').textContent='Valeur actuelle : '+fmt(current);
  document.getElementById('field').value=current||'';
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>document.getElementById('field').focus(),120);
}
function closeInput() { document.getElementById('overlay').classList.remove('show'); document.getElementById('field').value=''; inputKey=null; }
function handleBg(e){ if(e.target===document.getElementById('overlay')) closeInput(); }
function confirmInput() {
  const val=parseFloat(document.getElementById('field').value.replace(',','.'));
  if(isNaN(val)||val<0){closeInput();return;}
  const key=inputKey;
  if(key.startsWith('pea_'))   state.pea[key.slice(4)].value=val;
  if(key.startsWith('act_'))   state.actions[key.slice(4)].value=val;
  if(key.startsWith('banq_'))  state.banques[key.slice(5)].value=val;
  if(key.startsWith('crypto_'))state.crypto[key.slice(7)].value=val;
  finalize();
}
document.getElementById('field').addEventListener('keydown',e=>{ if(e.key==='Enter') confirmInput(); });

function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
function handleModalBg(e){ if(e.target===document.getElementById('modalOverlay')) closeModal(); }

function finalize() {
  state.lastUpdate=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
  pushHistory(); save(); closeInput(); render();
}
